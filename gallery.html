<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Dobby Emo 表情馆：查看 13 种状态的眼神与外壳姿态。">
<title>Dobby Emo · 表情馆</title>
<link rel="icon" type="image/webp" href="assets/sw/00.webp">
<link rel="preload" as="image" href="assets/sw/00.webp">
<link rel="stylesheet" href="css/style.css?v=86">
<link rel="stylesheet" href="css/gallery.css?v=86">
</head>
<body class="gallery-body">

<a class="skip-link" href="#gallery-main">跳到表情馆内容</a>

<header class="topbar">
  <div class="brand">
    <a class="gallery-back" href="index.html" title="返回主页" aria-label="返回主页">←</a>
    <img src="assets/sw/00.webp" alt="Dobby 角色头像" class="brand-logo" id="brandLogo">
    <div class="brand-text">
      <h1>表情馆</h1>
      <p>13 种状态 · 眼神与外壳一起变化</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="status-chip" id="statusChip">ID 00 / 13 · 待机</span>
    <button class="btn ghost" id="skinToggle" title="切换形象颜色"><i class="dot"></i><span class="lbl">形象</span></button>
    <button class="btn ghost" id="themeToggle" title="切换明暗主题"><i class="dot"></i><span class="lbl">主题</span></button>
  </div>
</header>

<main class="gallery" id="gallery-main">
  <section class="stage" aria-labelledby="stageName">
    <div class="stage-face"><div id="stageBox"></div></div>
    <div class="stage-info">
      <div class="stage-id" id="stageId">00</div>
      <h2 id="stageName">待机</h2>
      <p id="stageEn">Idle</p>
      <p class="stage-desc" id="stageDesc"></p>
      <div class="stage-tags" id="stageTags"></div>
      <p class="stage-hint">选择缩略图切换 · 悬停可预览 · ← / → 翻页</p>
    </div>
  </section>

  <section class="wall-section" aria-labelledby="wall-title">
    <div class="wall-head">
      <h2 id="wall-title">全部状态 <span class="wall-count" id="wallCount"></span></h2>
      <div class="filters" id="filters" aria-label="按状态分类筛选"></div>
    </div>
    <div class="wall" id="wall"></div>
  </section>
</main>

<footer class="footer">
  <p>Dobby Emo · 眼环几何取自 <a href="https://github.com/sam70361/aora-bot" target="_blank" rel="noopener">aora-bot / Emotion Ball</a>（MIT）· 引擎与素材仅限个人学习使用</p>
</footer>

<script src="js/eyering.js?v=86"></script>
<script src="js/emotions.js?v=86"></script>
<script src="js/dobby.js?v=86"></script>
<script src="js/gallery.js?v=86"></script>
</body>
</html>
