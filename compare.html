<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>白色形象候选对比</title>
<style>
  body { background: #14101f; color: #eee; font-family: system-ui, sans-serif; margin: 0; padding: 40px; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
  p.tip { text-align: center; color: #9d94b8; font-size: 13px; margin: 0 0 30px; }
  .row { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .card { background: #1d1730; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 22px; text-align: center; width: 340px; }
  .card img { width: 300px; height: 300px; object-fit: contain; }
  .card h2 { font-size: 16px; margin: 10px 0 4px; }
  .card p { font-size: 12.5px; color: #9d94b8; margin: 0; line-height: 1.6; }
  .tag { display: inline-block; margin-top: 10px; padding: 4px 14px; border-radius: 999px; font-size: 12px; border: 1px solid #8b6cff; background: rgba(139,108,255,.15); color: #d6c8ff; }
</style>
</head>
<body>
  <h1>粉色收敛 · 两个变体</h1>
  <p class="tip">E 方向保持不变，只降粉 —— 看完回「E2」或「E3」，我按选定方向重做全套 18 张</p>
  <div class="row">
    <div class="card">
      <img src="assets/base/cand-e2-final.png" alt="E2">
      <h2>E2 · 微醺奶油（淡粉保留一丝）</h2>
      <p>内耳是低饱和的灰粉色，几乎察觉不到<br>整体仍有一点点温度</p>
      <span class="tag">淡粉</span>
    </div>
    <div class="card">
      <img src="assets/base/cand-e3-final.png" alt="E3">
      <h2>E3 · 燕麦拿铁（完全无粉）</h2>
      <p>内耳改为米杏/浅驼色<br>全色系只有奶油+米色+淡紫</p>
      <span class="tag">无粉</span>
    </div>
  </div>
</body>
</html>
